<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rift Raiders Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden">

    <!-- AUTH LOCK OVERLAY (Kung hindi naka-login) -->
    <div id="auth-lock-overlay" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-red-600/40 p-8 rounded-xl max-w-md w-full shadow-2xl relative">
            
            <!-- Login Form -->
            <div id="login-modal">
                <h2 class="text-2xl font-bold text-red-500 mb-2">Rift Raiders Login</h2>
                <p class="text-xs text-slate-400 mb-6">Enter your credentials to access the portal.</p>
                
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Username</label>
                        <input type="text" id="login-username" required class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                        <input type="password" id="login-password" required class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded text-sm font-bold transition">Login to Account</button>
                </form>

                <p class="text-xs text-center text-slate-400 mt-4">
                    Don't have an account? <button onclick="switchModal('login-modal', 'register-modal')" class="text-red-400 underline font-medium">Register here</button>
                </p>
            </div>

            <!-- Register Form (Nakatago muna) -->
            <div id="register-modal" class="hidden">
                <h2 class="text-2xl font-bold text-red-500 mb-2">Create Account</h2>
                <p class="text-xs text-slate-400 mb-6">Join the Rift Raiders portal.</p>
                
                <form onsubmit="handleRegister(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Username</label>
                        <input type="text" id="reg-username" required class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Email</label>
                        <input type="email" id="reg-email" required class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                        <input type="password" id="reg-password" required class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Main Game</label>
                        <select id="reg-game" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="League of Legends">League of Legends</option>
                            <option value="Wild Rift">Wild Rift</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded text-sm font-bold transition">Register</button>
                </form>

                <p class="text-xs text-center text-slate-400 mt-4">
                    Already have an account? <button onclick="switchModal('register-modal', 'login-modal')" class="text-red-400 underline font-medium">Login here</button>
                </p>
            </div>

        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <!-- Sidebar: Channels -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
        <div>
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h1 class="font-bold text-red-500 text-lg tracking-wider">Rift Raiders</h1>
                <button id="add-channel-btn" onclick="addChannel()" class="hidden text-xs bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-2 py-1 rounded transition">+ Add</button>
            </div>
            <div class="p-3">
                <p class="text-[10px] uppercase font-semibold text-slate-500 px-3 mb-2">Channels</p>
                <div id="channel-list" class="space-y-1">
                    <!-- Dynamic Channels -->
                </div>
            </div>
        </div>

        <!-- User Profile Footer sa Sidebar -->
        <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
            <div class="cursor-pointer flex items-center space-x-2" onclick="openEditProfile()">
                <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center font-bold text-xs text-white">TR</div>
                <div>
                    <p id="sb-user-name" class="text-xs font-bold text-white">Username</p>
                    <p id="sb-user-role" class="text-[10px] text-slate-400">Role</p>
                </div>
            </div>
            <div id="logout-container" class="hidden">
                <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-red-400">Logout</button>
            </div>
        </div>
    </aside>

    <!-- Chat & Center Interface -->
    <main class="flex-1 flex flex-col bg-slate-950">
        <!-- Top Nav / Header -->
        <header class="h-14 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50">
            <div class="flex items-center space-x-2">
                <span class="text-red-500 font-bold">#</span>
                <span id="current-channel-title" class="font-semibold text-sm text-white">general</span>
            </div>
            <div>
                <button id="nav-admin-portal-btn" onclick="openAdminPortal()" class="hidden bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded font-bold transition">Admin Portal</button>
            </div>
        </header>

        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4">
            <!-- Dynamic Messages -->
        </div>

        <!-- Media Preview Container -->
        <div id="media-preview-container" class="hidden px-6 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-between">
            <span id="file-name-display" class="text-xs text-blue-400">Attachment</span>
            <button onclick="clearMedia()" class="text-xs text-red-400 hover:underline">Remove</button>
        </div>

        <!-- Mention Suggestions Box -->
        <div id="mention-suggestions" class="hidden absolute bottom-16 left-6 bg-slate-800 border border-slate-700 rounded shadow-lg w-48 z-10 p-1"></div>

        <!-- Message Input Form -->
        <div class="p-4 bg-slate-900 border-t border-slate-800">
            <form onsubmit="handleSendMessage(event)" class="relative flex items-center">
                <input type="text" id="message-input" placeholder="Type a message or use @ to mention..." autocomplete="off" class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-4 pr-24 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                <div class="absolute right-2 flex items-center space-x-2">
                    <label class="cursor-pointer text-slate-400 hover:text-white text-sm">
                        📎<input type="file" id="media-input" onchange="previewMedia(this)" class="hidden">
                    </label>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-xs font-bold transition">Send</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Right Sidebar: Member List -->
    <aside class="w-60 bg-slate-900 border-l border-slate-800 p-4 flex flex-col">
        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Members</h3>
        <div id="member-list" class="space-y-1 overflow-y-auto flex-1">
            <!-- Dynamic Member List -->
        </div>
    </aside>

    <!-- Profile View Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl max-w-xs w-full relative">
            <div id="profile-modal-content">
                <!-- Dynamic Profile Details -->
            </div>
            <button onclick="closeModal('profile-modal')" class="mt-4 w-full bg-slate-800 hover:bg-slate-700 text-xs py-1.5 rounded text-white font-medium">Close</button>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="hidden fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl max-w-sm w-full relative">
            <h3 class="text-lg font-bold text-red-500 mb-4">Edit Profile & Socials</h3>
            <form onsubmit="handleSaveProfile(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Main Game</label>
                    <input type="text" id="edit-game" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">TikTok Link</label>
                    <input type="url" id="edit-tiktok" placeholder="https://tiktok.com/@..." class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Discord Tag / Link</label>
                    <input type="text" id="edit-discord" placeholder="username#0000" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">FB Page Link</label>
                    <input type="url" id="edit-fb" placeholder="https://facebook.com/..." class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">X (Twitter) Link</label>
                    <input type="url" id="edit-x" placeholder="https://x.com/..." class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Spotify Profile Link</label>
                    <input type="url" id="edit-spotify" placeholder="https://spotify.com/..." class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-xs text-white">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-1.5 rounded text-xs font-bold">Save Changes</button>
                    <button type="button" onclick="closeModal('edit-profile-modal')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded text-xs">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CONTROLLER SCRIPT -->
    <script>
        // --- DATABASE & STATE SETUP ---
        let dbUsers = JSON.parse(localStorage.getItem('riftRaidersUsers')) || [];
        let dbMessages = JSON.parse(localStorage.getItem('rift_db_messages')) || {};
        let dbChannels = JSON.parse(localStorage.getItem('rift_db_channels')) || ['general', 'wild-rift', 'league-of-legends'];
        let currentChannel = dbChannels[0];
        let currentUser = JSON.parse(localStorage.getItem('rift_current_user')) || null;
        let currentMediaData = null;
        let currentMediaName = null;

        // Awtomatikong pag-setup ng Takeku Admin account
        if (!dbUsers.find(u => u.username === 'Takeku')) {
            dbUsers.push({
                username: 'Takeku',
                password: 'Kushime07092004.',
                isAdmin: true,
                isApproved: true,
                role: 'Admin / Owner',
                game: 'League of Legends',
                pfp: 'https://via.placeholder.com/150',
                socials: { tiktok: '', discord: '', fb: '', x: '', spotify: '' }
            });
            saveDB();
        }

        function saveDB() {
            localStorage.setItem('riftRaidersUsers', JSON.stringify(dbUsers));
            localStorage.setItem('rift_db_messages', JSON.stringify(dbMessages));
            localStorage.setItem('rift_db_channels', JSON.stringify(dbChannels));
            if (currentUser) {
                localStorage.setItem('rift_current_user', JSON.stringify(currentUser));
            } else {
                localStorage.removeItem('rift_current_user');
            }
        }

        // --- MODAL CONTROLS ---
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove('hidden');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add('hidden');
        }

        function switchModal(closeId, openId) {
            closeModal(closeId);
            openModal(openId);
        }

        // --- AUTHENTICATION & REGISTRATION ---
        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value;

            let found = dbUsers.find(u => u.username.toLowerCase() === usernameInput.toLowerCase());

            if (!found) {
                alert('Account not found! Please register first.');
                return;
            }

            if (found.password && found.password !== passwordInput) {
                alert('Incorrect password!');
                return;
            }

            if (!found.isAdmin && !found.isApproved) {
                alert('Your account is pending admin approval.');
                return;
            }

            currentUser = found;
            currentUser.lastActive = Date.now();
            saveDB();
            
            initAppState();
            closeModal('auth-lock-overlay');
        }

        function handleRegister(e) {
            e.preventDefault();
            const newUsername = document.getElementById('reg-username').value.trim();
            const emailInput = document.getElementById('reg-email').value.trim();
            const passwordInput = document.getElementById('reg-password').value;
            const gameInput = document.getElementById('reg-game').value;

            if (dbUsers.some(u => u.username.toLowerCase() === newUsername.toLowerCase())) {
                alert('Username already exists!');
                return;
            }

            const isAdminAcc = newUsername.toLowerCase() === 'takeku';

            const newUser = {
                username: newUsername,
                password: passwordInput,
                email: emailInput,
                game: gameInput,
                isAdmin: isAdminAcc,
                isApproved: isAdminAcc, 
                role: isAdminAcc ? 'Admin / Owner' : 'Pending Approval',
                pfp: 'https://via.placeholder.com/150',
                socials: { tiktok: '', discord: '', fb: '', x: '', spotify: '' }
            };

            dbUsers.push(newUser);
            saveDB();
            
            alert(isAdminAcc ? 'Registration successful! Logged in as Admin.' : 'Registration successful! Please wait for Admin approval.');
            switchModal('register-modal', 'login-modal');
        }

        function handleLogout() {
            currentUser = null;
            saveDB();
            const lockOverlay = document.getElementById('auth-lock-overlay');
            const logoutCont = document.getElementById('logout-container');
            if (lockOverlay) lockOverlay.classList.remove('hidden');
            if (logoutCont) logoutCont.classList.add('hidden');
            
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        // --- APP STATE & UI ---
        function initAppState() {
            if (!currentUser) return;
            const lockOverlay = document.getElementById('auth-lock-overlay');
            if (lockOverlay) lockOverlay.classList.add('hidden');
            
            const userNameEl = document.getElementById('sb-user-name');
            const userRoleEl = document.getElementById('sb-user-role');
            if (userNameEl) userNameEl.innerText = currentUser.username;
            if (userRoleEl) userRoleEl.innerText = currentUser.role || (currentUser.isAdmin ? "Admin" : "Member");
            
            const adminBtn = document.getElementById('nav-admin-portal-btn');
            const addChanBtn = document.getElementById('add-channel-btn');
            const logoutCont = document.getElementById('logout-container');

            if (currentUser.isAdmin) {
                if (adminBtn) adminBtn.classList.remove('hidden');
                if (addChanBtn) addChanBtn.classList.remove('hidden');
            } else {
                if (adminBtn) adminBtn.classList.add('hidden');
                if (addChanBtn) addChanBtn.classList.add('hidden');
            }
            
            if (logoutCont) logoutCont.classList.remove('hidden');
            renderChannels();
            loadChannelMessages(currentChannel);
            renderMemberList();
        }

        // --- CHANNELS & MESSAGES ---
        function renderChannels() {
            const channelListEl = document.getElementById('channel-list');
            if (!channelListEl) return;
            channelListEl.innerHTML = '';
            
            dbChannels.forEach(channel => {
                const isActive = channel === currentChannel;
                channelListEl.innerHTML += `
                    <button onclick="switchChannel('${channel}')" class="w-full text-left px-3 py-2 rounded text-sm font-medium ${isActive ? 'bg-red-600 text-white' : 'text-slate-300 hover:bg-slate-800'}">
                        # ${channel}
                    </button>`;
            });
        }

        function switchChannel(channelName) {
            currentChannel = channelName;
            document.getElementById('current-channel-title').innerText = channelName;
            renderChannels();
            loadChannelMessages(channelName);
        }

        function addChannel() {
            if (!currentUser || !currentUser.isAdmin) {
                alert("Admin access required.");
                return;
            }
            let newChan = prompt("Enter new channel name:");
            if (newChan) {
                newChan = newChan.trim().toLowerCase().replace(/\s+/g, '-');
                if (newChan && !dbChannels.includes(newChan)) {
                    dbChannels.push(newChan);
                    saveDB();
                    renderChannels();
                } else {
                    alert("Channel already exists or invalid name.");
                }
            }
        }

        function loadChannelMessages(channelName) {
            currentChannel = channelName;
            const chatContainer = document.getElementById('chat-messages');
            if (!chatContainer) return;
            
            chatContainer.innerHTML = '';
            let msgs = dbMessages[channelName] || [];
            
            msgs.forEach(msg => {
                let isOwner = currentUser && (currentUser.username === msg.username || currentUser.isAdmin);
                let actionButtons = '';
                
                if (isOwner) {
                    actionButtons = `
                        <span class="float-right text-xs space-x-2">
                            <button onclick="editMessage(${msg.id})" class="text-slate-400 hover:text-white">Edit</button>
                            <button onclick="deleteMessage(${msg.id})" class="text-red-400 hover:text-red-300">Delete</button>
                        </span>`;
                }

                let badgeHtml = msg.isAdmin ? `<span class="bg-red-600 text-white text-[10px] px-1 rounded ml-1">Admin</span>` : '';
                let gameTag = msg.game ? `<span class="bg-slate-800 text-slate-300 text-[10px] px-1 rounded ml-1">${msg.game}</span>` : '';

                chatContainer.innerHTML += `
                    <div class="mb-3 pl-2 border-l-2 border-red-500 relative">
                        <div>
                            <span class="text-red-400 font-bold text-xs cursor-pointer hover:underline" onclick="viewUserProfile('${msg.username}')">${msg.username}</span>
                            ${badgeHtml} ${gameTag}
                            <span class="text-slate-500 text-[10px] ml-2">${msg.time || ''}</span>
                            ${actionButtons}
                        </div>
                        <div class="text-slate-200 text-sm mt-1">${msg.text}</div>
                    </div>`;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // --- MEMBER LIST & MENTIONS ---
        function renderMemberList() {
            const memberListEl = document.getElementById('member-list');
            if (!memberListEl) return;
            memberListEl.innerHTML = '';
            
            dbUsers.forEach(user => {
                if (!user.isApproved && !user.isAdmin) return;
                let isOnline = user.lastActive && (Date.now() - user.lastActive < 10000);
                let gameIconTag = user.game === 'League of Legends' ? '[LoL]' : user.game === 'Wild Rift' ? '[WR]' : '';
                memberListEl.innerHTML += `
                    <div class="flex items-center justify-between py-1 text-xs text-slate-300 cursor-pointer hover:bg-slate-800 px-1 rounded" onclick="viewUserProfile('${user.username}')">
                        <span>${gameIconTag} ${user.username} ${user.isAdmin ? '<span class="text-red-400">(Admin)</span>' : ''}</span>
                        <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-green-500' : 'bg-slate-600'}"></span>
                    </div>`;
            });
        }

        const messageInput = document.getElementById('message-input');
        if (messageInput) {
            messageInput.addEventListener('input', function(e) {
                let val = e.target.value;
                let mentionSuggestions = document.getElementById('mention-suggestions');
                if (!mentionSuggestions) return;

                let lastAtIndex = val.lastIndexOf('@');
                if (lastAtIndex !== -1 && (lastAtIndex === 0 || val[lastAtIndex - 1] === ' ')) {
                    let query = val.substring(lastAtIndex + 1).toLowerCase();
                    let matchedUsers = dbUsers.filter(u => u.username.toLowerCase().startsWith(query));
                    
                    if (matchedUsers.length > 0) {
                        mentionSuggestions.innerHTML = matchedUsers.map(u => 
                            `<div onclick="insertMention('${u.username}')" class="p-1 hover:bg-slate-700 cursor-pointer text-xs text-white">@${u.username}</div>`
                        ).join('');
                        mentionSuggestions.classList.remove('hidden');
                    } else {
                        mentionSuggestions.classList.add('hidden');
                    }
                } else {
                    mentionSuggestions.classList.add('hidden');
                }
            });
        }

        function insertMention(username) {
            let input = document.getElementById('message-input');
            let val = input.value;
            let lastAtIndex = val.lastIndexOf('@');
            input.value = val.substring(0, lastAtIndex) + `@${username} `;
            document.getElementById('mention-suggestions').classList.add('hidden');
            input.focus();
        }

        // --- PROFILE & SOCIALS MODAL ---
        function viewUserProfile(username) {
            let user = dbUsers.find(u => u.username === username);
            if (!user) return;

            let socials = user.socials || {};
            let socialsHtml = `
                <p class="text-xs text-slate-400 mt-2"><b>Game:</b> ${user.game || 'Not specified'}</p>
                <div class="mt-4 space-y-1 text-xs">
                    <p>TikTok: ${socials.tiktok ? `<a href="${socials.tiktok}" target="_blank" class="text-red-400 underline">${socials.tiktok}</a>` : 'None'}</p>
                    <p>Discord: ${socials.discord ? `<span class="text-blue-400">${socials.discord}</span>` : 'None'}</p>
                    <p>FB Page: ${socials.fb ? `<a href="${socials.fb}" target="_blank" class="text-blue-400 underline">${socials.fb}</a>` : 'None'}</p>
                    <p>X (Twitter): ${socials.x ? `<a href="${socials.x}" target="_blank" class="text-slate-300 underline">${socials.x}</a>` : 'None'}</p>
                    <p>Spotify: ${socials.spotify ? `<a href="${socials.spotify}" target="_blank" class="text-green-400 underline">${socials.spotify}</a>` : 'None'}</p>
                </div>
            `;

            let profileModalContent = document.getElementById('profile-modal-content');
            if (profileModalContent) {
                profileModalContent.innerHTML = `
                    <div class="text-center">
                        <img src="${user.pfp || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-full mx-auto object-cover border border-red-500">
                        <h3 class="text-white font-bold mt-2">${user.username} ${user.isAdmin ? '(Admin)' : ''}</h3>
                        <p class="text-xs text-slate-400">${user.role || 'Member'}</p>
                    </div>
                    ${socialsHtml}
                `;
                openModal('profile-modal');
            } else {
                alert(`User: ${user.username}\nRole: ${user.role}\nGame: ${user.game}`);
            }
        }

        function openEditProfile() {
            if (!currentUser) return;
            document.getElementById('edit-game').value = currentUser.game || '';
            document.getElementById('edit-tiktok').value = currentUser.socials?.tiktok || '';
            document.getElementById('edit-discord').value = currentUser.socials?.discord || '';
            document.getElementById('edit-fb').value = currentUser.socials?.fb || '';
            document.getElementById('edit-x').value = currentUser.socials?.x || '';
            document.getElementById('edit-spotify').value = currentUser.socials?.spotify || '';
            openModal('edit-profile-modal');
        }

        function handleSaveProfile(e) {
            e.preventDefault();
            currentUser.game = document.getElementById('edit-game').value;
            currentUser.socials = {
                tiktok: document.getElementById('edit-tiktok').value,
                discord: document.getElementById('edit-discord').value,
                fb: document.getElementById('edit-fb').value,
                x: document.getElementById('edit-x').value,
                spotify: document.getElementById('edit-spotify').value
            };

            let index = dbUsers.findIndex(u => u.username === currentUser.username);
            if (index !== -1) dbUsers[index] = currentUser;

            saveDB();
            alert('Profile updated successfully!');
            closeModal('edit-profile-modal');
            initAppState();
        }

        // --- ADMIN PORTAL (May password check: rr2024) ---
        function openAdminPortal() {
            if (!currentUser || !currentUser.isAdmin) {
                alert("Access denied. Admin only.");
                return;
            }

            let adminPassPrompt = prompt("Enter Admin Portal Password:");
            if (adminPassPrompt !== "rr2024") {
                alert("Incorrect admin password!");
                return;
            }

            let pendingUsers = dbUsers.filter(u => !u.isApproved && !u.isAdmin);
            let pendingListStr = pendingUsers.length > 0 
                ? pendingUsers.map((u, i) => `${i + 1}. ${u.username} (${u.game})`).join('\n')
                : "No pending users.";

            let action = prompt(`=== ADMIN PORTAL ===\n1. Approve Pending Users\n2. Manage / Ban Users\n3. Edit Website Branding\n\nEnter option number:`);
            
            if (action === "1") {
                if (pendingUsers.length === 0) {
                    alert("Walang pending users na naghihintay ng approval.");
                    return;
                }
                let targetName = prompt(`Pending Users:\n${pendingListStr}\n\nI-type ang username ng gustong i-approve:`);
                let targetUser = dbUsers.find(u => u.username.toLowerCase() === targetName?.toLowerCase());
                if (targetUser) {
                    targetUser.isApproved = true;
                    targetUser.role = 'Member';
                    saveDB();
                    alert(`Na-approve na si ${targetUser.username}!`);
                    renderMemberList();
                }
            } else if (action === "2") {
                let allNames = dbUsers.map(u => u.username).join(', ');
                let banName = prompt(`Lahat ng Users: ${allNames}\n\nI-type ang username na gustong i-ban/tanggalin:`);
                if (banName && banName.toLowerCase() !== 'takeku') {
                    dbUsers = dbUsers.filter(u => u.username.toLowerCase() !== banName.toLowerCase());
                    saveDB();
                    alert(`Tinanggal na sa sistema si ${banName}.`);
                    renderMemberList();
                } else {
                    alert("Hindi maaaring tanggalin ang pangunahing Admin account.");
                }
            } else if (action === "3") {
                let newTitle = prompt("Ilagay ang bagong pangalan ng Website (Title):");
                if (newTitle) {
                    document.title = newTitle;
                    localStorage.setItem('rift_site_title', newTitle);
                    alert("Na-update na ang website title!");
                }
            }
        }

        // --- MESSAGING & MEDIA ---
        function handleSendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if((text !== '' || currentMediaData) && currentUser) {
                let finalMsg = text;
                if(currentMediaData) {
                    finalMsg += `<br><a href="${currentMediaData}" download="${currentMediaName}" class="text-blue-400 underline text-[10px]">📎 ${currentMediaName}</a>`;
                }

                const newMsg = {
                    id: Date.now(),
                    username: currentUser.username,
                    game: currentUser.game,
                    isAdmin: currentUser.isAdmin,
                    text: finalMsg,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                };

                if(!dbMessages[currentChannel]) dbMessages[currentChannel] = [];
                dbMessages[currentChannel].push(newMsg);
                
                saveDB();
                loadChannelMessages(currentChannel);
                
                input.value = '';
                clearMedia();
            }
        }

        function editMessage(msgId) {
            let msgs = dbMessages[currentChannel] || [];
            let msg = msgs.find(m => m.id === msgId);
            if (!msg) return;

            let newText = prompt("Edit message:", msg.text);
            if (newText !== null && newText.trim() !== "") {
                msg.text = newText.trim();
                saveDB();
                loadChannelMessages(currentChannel);
            }
        }

        function deleteMessage(msgId) {
            if (confirm("Delete this message?")) {
                dbMessages[currentChannel] = (dbMessages[currentChannel] || []).filter(m => m.id !== msgId);
                saveDB();
                loadChannelMessages(currentChannel);
            }
        }

        function previewMedia(input) {
            if (input.files && input.files[0]) {
                currentMediaName = input.files[0].name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentMediaData = e.target.result;
                    const preview = document.getElementById('media-preview-container');
                    const nameDisplay = document.getElementById('file-name-display');
                    if (preview) preview.classList.remove('hidden');
                    if (nameDisplay) nameDisplay.innerText = currentMediaName;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearMedia() {
            const mediaInput = document.getElementById('media-input');
            const preview = document.getElementById('media-preview-container');
            if (mediaInput) mediaInput.value = '';
            if (preview) preview.classList.add('hidden');
            currentMediaData = null;
            currentMediaName = null;
        }

        // Real-time loop
        setInterval(() => {
            if(currentUser) {
                currentUser.lastActive = Date.now();
                saveDB();
            }
            dbChannels = JSON.parse(localStorage.getItem('rift_db_channels')) || dbChannels;
            dbMessages = JSON.parse(localStorage.getItem('rift_db_messages')) || dbMessages;
            renderMemberList();
        }, 5000);

        // Auto-init kung may active session
        if (currentUser) {
            initAppState();
            let savedTitle = localStorage.getItem('rift_site_title');
            if (savedTitle) document.title = savedTitle;
        }
    </script>
</body>
</html>
