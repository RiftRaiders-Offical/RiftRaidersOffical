<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord Style Chat</title>
    <style>
        body { background-color: #313338; color: #dbdee1; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; flex-direction: column; position: relative; }
        .message-header { font-weight: bold; color: #fff; font-size: 14px; }
        .message-content { font-size: 14px; margin-top: 4px; }
        .message img { max-width: 300px; border-radius: 8px; margin-top: 8px; }
        .reply-preview-box { background: #2b2d31; padding: 5px 10px; font-size: 12px; border-left: 4px solid #5865f2; margin-bottom: 5px; display: none; justify-content: space-between; align-items: center; }
        .mentioned { background-color: rgba(88, 101, 242, 0.3); padding: 2px 4px; border-radius: 4px; color: #c9cdfb; font-weight: bold; }
        #input-container { background: #383a40; padding: 20px; display: flex; flex-direction: column; gap: 5px; }
        .active-reply-banner { background: #2b2d31; padding: 8px; font-size: 12px; display: none; justify-content: space-between; border-radius: 4px; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #383a40; border: none; padding: 10px; border-radius: 8px; color: #fff; outline: none; background: #1e1f22; }
        button { background: #5865f2; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #4752c4; }
        #notification-popout { position: fixed; top: 20px; right: 20px; background: #232428; border-left: 5px solid #fbee21; padding: 15px; border-radius: 5px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000; }
    </style>
</head>
<body>

    <!-- Notification Popout para sa Mentions -->
    <div id="notification-popout">
        <strong id="notif-title">May nag-mention sa iyo!</strong>
        <p id="notif-body" style="margin: 5px 0 0 0; font-size: 13px;"></p>
    </div>

    <div id="chat-container"></div>

    <div id="input-container">
        <div id="active-reply" class="active-reply-banner">
            <span id="reply-text-info">Replying to...</span>
            <button onclick="cancelReply()" style="background:transparent; color:#f23f43; padding:0; cursor:pointer;">Cancel</button>
        </div>
        <div class="input-row">
            <input type="text" id="username-input" placeholder="Username mo" style="width: 150px;">
            <input type="text" id="message-input" placeholder="Mag-message... (Gamitin ang @ para mag-mention)">
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="previewFile()">
            <button onclick="document.getElementById('file-input').click()">📷</button>
            <button onclick="sendMessage()">Send</button>
        </div>
        <div id="file-preview-name" style="font-size: 11px; color: #949ba4;"></div>
    </div>

    <script>
        let replyingToId = null;
        let currentUser = "User_" + Math.floor(Math.random() * 1000);
        document.getElementById('username-input').value = currentUser;

        async function fetchMessages() {
            const res = await fetch('http://localhost:3000/api/messages');
            const messages = await res.json();
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message';

                let replyHtml = '';
                if (msg.reply_to_id) {
                    replyHtml = `<div style="font-size: 11px; color: #949ba4; border-left: 2px solid #4e5058; padding-left: 6px; margin-bottom: 4px;">
                        ↳ <b>@${msg.reply_username}</b>: ${msg.reply_content || '[Image]'}
                    </div>`;
                }

                // Format Mentions
                let formattedContent = msg.content;
                if (msg.mentioned_user) {
                    formattedContent = formattedContent.replace(`@${msg.mentioned_user}`, `<span class="mentioned">@${msg.mentioned_user}</span>`);
                    
                    // Kung ikaw ang na-mention, mag-pop out ang notification
                    if (msg.mentioned_user === document.getElementById('username-input').value && msg.username !== currentUser) {
                        showNotification(msg.username, msg.content);
                    }
                }

                div.innerHTML = `
                    ${replyHtml}
                    <div class="message-header">${msg.username} <span style="font-size:10px; color:#949ba4;">${new Date(msg.created_at).toLocaleTimeString()}</span></div>
                    <div class="message-content">${formattedContent}</div>
                    ${msg.image_url ? `<img src="http://localhost:3000${msg.image_url}" />` : ''}
                    <button onclick="setReply(${msg.id}, '${msg.username}', '${msg.content.replace(/'/g, "\\'")}')" style="background:transparent; color:#949ba4; font-size:11px; width:fit-content; padding:2px; margin-top:4px; cursor:pointer;">Reply</button>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function setReply(id, username, content) {
            replyingToId = id;
            document.getElementById('active-reply').style.display = 'flex';
            document.getElementById('reply-text-info').innerText = `Replying to @${username}: "${content.substring(0, 30)}..."`;
        }

        function cancelReply() {
            replyingToId = null;
            document.getElementById('active-reply').style.display = 'none';
        }

        function previewFile() {
            const file = document.getElementById('file-input').files[0];
            if (file) {
                document.getElementById('file-preview-name').innerText = `Attached: ${file.name}`;
            }
        }

        async function sendMessage() {
            currentUser = document.getElementById('username-input').value;
            const content = document.getElementById('message-input').value;
            const fileInput = document.getElementById('file-input');

            if (!content && fileInput.files.length === 0) return;

            // Detect kung may @mention sa text
            let mentionedUser = null;
            const mentionMatch = content.match(/@(\w+)/);
            if (mentionMatch) {
                mentionedUser = mentionMatch[1];
            }

            const formData = new FormData();
            formData.append('username', currentUser);
            formData.append('content', content);
            if (replyingToId) formData.append('reply_to_id', replyingToId);
            if (mentionedUser) formData.append('mentioned_user', mentionedUser);
            if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

            await fetch('http://localhost:3000/api/messages', {
                method: 'POST',
                body: formData
            });

            // Reset inputs
            document.getElementById('message-input').value = '';
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview-name').innerText = '';
            cancelReply();
            fetchMessages();
        }

        function showNotification(sender, text) {
            const notif = document.getElementById('notification-popout');
            document.getElementById('notif-body').innerText = `${sender}: ${text}`;
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 4000);
        }

        // Auto-refresh chat every 3 seconds para maging real-time
        setInterval(fetchMessages, 3000);
        fetchMessages();
    </script>
</body>
</html>
