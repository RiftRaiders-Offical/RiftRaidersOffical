<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="main-site-title">Rift Raiders Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-[#0b0c10] text-slate-100 font-sans antialiased h-screen flex flex-hidden overflow-hidden">

    <!-- Sidebar / Navigation -->
    <div class="w-64 bg-[#12141c] border-r border-red-600/20 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-4 border-b border-red-600/20 flex items-center space-x-2">
                <span class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></span>
                <h1 id="sidebar-brand-title" class="font-black tracking-wider text-red-500 uppercase text-sm">Rift Raiders</h1>
            </div>
            <div class="p-4">
                <p class="text-xs text-slate-400 mb-2 uppercase font-bold tracking-wider">Channels</p>
                <div class="space-y-1">
                    <button onclick="loadChannelMessages('general')" class="w-full text-left px-3 py-2 text-xs rounded text-slate-300 hover:bg-[#1f2333] hover:text-white transition"># general</button>
                    <button onclick="loadChannelMessages('announcements')" class="w-full text-left px-3 py-2 text-xs rounded text-slate-300 hover:bg-[#1f2333] hover:text-white transition"># announcements</button>
                    <button onclick="loadChannelMessages('scrims')" class="w-full text-left px-3 py-2 text-xs rounded text-slate-300 hover:bg-[#1f2333] hover:text-white transition"># scrims</button>
                </div>
            </div>
        </div>
        <div class="p-4 border-t border-red-600/20">
            <button onclick="openAdminPasswordModal()" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 text-xs py-2 rounded font-bold border border-red-600/30 transition mb-2">Admin Portal</button>
            <button onclick="openEditProfile()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs py-2 rounded font-bold transition">Edit Profile</button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col h-full bg-[#0b0c10]">
        <!-- Top Nav Header -->
        <div class="h-14 border-b border-red-600/20 bg-[#12141c] px-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-red-500 font-bold">#</span>
                <span id="current-channel-title" class="font-bold text-sm text-white">general</span>
            </div>
            <div id="current-user-display" class="text-xs text-slate-300 flex items-center space-x-2">
                <!-- User info dynamically rendered here -->
            </div>
        </div>

        <!-- Chat Messages & Member List Wrapper -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Messages Container -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
                <!-- Messages go here -->
            </div>

            <!-- Member List Sidebar -->
            <div class="w-56 border-l border-red-600/20 bg-[#12141c] p-3 overflow-y-auto hidden lg:block">
                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3">Members</p>
                <div id="member-list" class="space-y-1">
                    <!-- Members list goes here -->
                </div>
            </div>
        </div>

        <!-- Message Input Box -->
        <div class="p-4 bg-[#12141c] border-t border-red-600/20 relative">
            <!-- Mention Suggestions Popup -->
            <div id="mention-suggestions" class="absolute bottom-16 left-4 bg-[#1a1d29] border border-red-600/30 rounded shadow-lg hidden w-48 z-20 max-h-32 overflow-y-auto"></div>
            
            <!-- Media Preview Container -->
            <div id="media-preview-container" class="hidden mb-2 p-2 bg-[#1a1d29] rounded border border-red-600/20 flex items-center justify-between text-xs">
                <span id="file-name-display" class="text-red-400 truncate"></span>
                <button type="button" onclick="clearMedia()" class="text-slate-400 hover:text-white font-bold px-1">✕</button>
            </div>

            <form onsubmit="handleSendMessage(event)" class="flex items-center space-x-2">
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded text-xs flex items-center justify-center">
                    📎
                    <input type="file" id="media-input" onchange="previewMedia(this)" class="hidden">
                </label>
                <input type="text" id="message-input" placeholder="Message #general (Type @ to mention)..." class="flex-1 bg-[#0b0c10] border border-slate-700 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-red-600">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-xs font-bold transition">Send</button>
            </form>
        </div>
    </div>

    <!-- Modals (Profile, Edit Profile, Admin Portal, etc.) can be placed here -->
    <!-- Profile Modal -->
    <div id="profile-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
        <div class="bg-[#12141c] border border-red-600/30 rounded-lg p-6 w-80 relative">
            <button onclick="closeModal('profile-modal')" class="absolute top-3 right-3 text-slate-400 hover:text-white">✕</button>
            <div class="flex flex-col items-center text-center">
                <img id="profile-avatar" class="w-16 h-16 rounded-full object-cover border-2 border-red-600 mb-3 bg-slate-800">
                <h3 id="profile-username" class="font-bold text-white text-base">Username</h3>
                <span id="profile-role-badge" class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded font-bold mt-1">Member</span>
                <p id="profile-team" class="text-xs text-red-400 mt-2">Team / Role: Unassigned</p>
                <p id="profile-game" class="text-xs text-slate-300 mt-1">Main Game: League of Legends</p>
                <div id="profile-socials-list" class="mt-4 text-xs space-y-1 text-left w-full border-t border-slate-800 pt-3">
                    <!-- Socials rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
        <div class="bg-[#12141c] border border-red-600/30 rounded-lg p-6 w-90 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('edit-profile-modal')" class="absolute top-3 right-3 text-slate-400 hover:text-white">✕</button>
            <h3 class="font-bold text-white text-base mb-4">Edit Profile</h3>
            <form onsubmit="handleSaveProfile(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Main Game</label>
                    <input type="text" id="edit-game" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">TikTok URL</label>
                    <input type="text" id="edit-tiktok" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Discord Tag</label>
                    <input type="text" id="edit-discord" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Facebook Page URL</label>
                    <input type="text" id="edit-fb" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">X (Twitter) URL</label>
                    <input type="text" id="edit-x" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Spotify URL</label>
                    <input type="text" id="edit-spotify" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Profile Picture File</label>
                    <input type="file" id="edit-avatar-file" class="w-full text-slate-300 text-xs">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded transition mt-2">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Admin Password Modal -->
    <div id="admin-password-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
        <div class="bg-[#12141c] border border-red-600/30 rounded-lg p-6 w-80 relative">
            <button onclick="closeModal('admin-password-modal')" class="absolute top-3 right-3 text-slate-400 hover:text-white">✕</button>
            <h3 class="font-bold text-white text-base mb-3">Admin Authentication</h3>
            <form onsubmit="handleAdminAuth(event)" class="space-y-3 text-xs">
                <input type="password" id="admin-portal-pass-input" placeholder="Enter admin password" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded">Authenticate</button>
            </form>
        </div>
    </div>

    <!-- Admin Portal Modal -->
    <div id="admin-portal-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
        <div class="bg-[#12141c] border border-red-600/30 rounded-lg p-6 w-[600px] max-h-[85vh] overflow-y-auto relative">
            <button onclick="closeModal('admin-portal-modal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
            <h3 class="font-bold text-white text-lg mb-4 text-red-500">Admin Control Panel</h3>
            
            <div class="space-y-6 text-xs">
                <div>
                    <h4 class="font-bold text-slate-300 mb-2 uppercase tracking-wide">Pending Registrations</h4>
                    <div id="admin-pending-list" class="space-y-2"></div>
                </div>

                <div>
                    <h4 class="font-bold text-slate-300 mb-2 uppercase tracking-wide">Manage Members & Teams</h4>
                    <div id="admin-members-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>

                <div class="border-t border-slate-800 pt-4">
                    <h4 class="font-bold text-slate-300 mb-2 uppercase tracking-wide">Website Branding</h4>
                    <div class="space-y-2">
                        <input type="text" id="admin-site-title-input" placeholder="Site Title" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                        <input type="text" id="admin-brand-text-input" placeholder="Brand Header Text" class="w-full bg-[#0b0c10] border border-slate-700 rounded p-2 text-white">
                        <button type="button" onclick="updateWebsiteBranding()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded">Update Branding</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script>
        // Mock / Initial Variables
        let currentChannel = 'general';
        let currentUser = JSON.parse(localStorage.getItem('rift_current_user')) || { username: 'Guest', isAdmin: false, game: 'League of Legends' };
        let dbMessages = {};
        let dbUsers = [];
        let currentMediaData = null;
        let currentMediaName = null;

        // Firebase Initialization Placeholder (Replace with your own config if needed)
        const firebaseConfig = {
            databaseURL: "https://your-firebase-app-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function initFirebaseListeners() {
            database.ref('messages').on('value', snapshot => {
                dbMessages = snapshot.val() || {};
                loadChannelMessages(currentChannel);
            });
            database.ref('users').on('value', snapshot => {
                let val = snapshot.val() || {};
                dbUsers = Object.values(val);
                renderMemberList();
            });
        }

        function initAppState() {
            loadChannelMessages(currentChannel);
            renderMemberList();
        }

        function openModal(modalId) {
            document.getElementById(modalId)?.classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId)?.classList.add('hidden');
        }

        function saveUserToFirebase(user) {
            if (user && user.username) {
                database.ref('users/' + user.username).set(user);
            }
        }

        // --- IYONG MGA IBINIGAY NA FUNCTIONS NA PINAG-ISA ---

        function loadChannelMessages(channelName) {
            currentChannel = channelName;
            const chatContainer = document.getElementById('chat-messages');
            const channelTitleEl = document.getElementById('current-channel-title');
            if (channelTitleEl) channelTitleEl.innerText = channelName;
            if (!chatContainer) return;
            
            chatContainer.innerHTML = '';
            let msgs = dbMessages[channelName] || [];
            
            msgs.forEach(msg => {
                if (!msg) return;
                let isOwner = currentUser && (currentUser.username === msg.username || currentUser.isAdmin);
                let actionButtons = isOwner ? `
                    <span class="float-right text-xs space-x-2">
                        <button type="button" onclick="editMessage(${msg.id})" class="text-slate-400 hover:text-white">Edit</button>
                        <button type="button" onclick="deleteMessage(${msg.id})" class="text-red-500 hover:text-red-400">Delete</button>
                    </span>` : '';

                let senderUser = dbUsers.find(u => u && u.username === msg.username);
                let senderPfp = senderUser?.pfp || `https://api.dicebear.com/7.x/identicon/svg?seed=${msg.username}`;
                let senderTeam = senderUser?.team && senderUser.team !== 'Unassigned' ? `<span class="bg-red-950 text-red-400 text-[10px] px-1.5 py-0.5 rounded ml-1 border border-red-600/30">${senderUser.team}</span>` : '';
                let badgeHtml = msg.isAdmin ? `<span class="bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded ml-1 font-bold">Admin</span>` : '';
                let gameTag = msg.game ? `<span class="bg-[#151821] text-slate-300 text-[10px] px-1.5 py-0.5 rounded ml-1 border border-slate-700/50">${msg.game}</span>` : '';

                chatContainer.innerHTML += `
                    <div class="mb-4 flex items-start space-x-3">
                        <img src="${senderPfp}" class="w-8 h-8 rounded-full object-cover bg-slate-800 border border-red-600/30 cursor-pointer mt-0.5" onclick="viewUserProfile('${msg.username}')">
                        <div class="flex-1">
                            <div>
                                <span class="text-red-500 font-bold text-xs cursor-pointer hover:underline" onclick="viewUserProfile('${msg.username}')">${msg.username}</span>
                                ${badgeHtml} ${senderTeam} ${gameTag}
                                <span class="text-slate-500 text-[10px] ml-2">${msg.time || ''}</span>
                                ${actionButtons}
                            </div>
                            <div class="text-slate-200 text-sm mt-0.5">${msg.text}</div>
                        </div>
                    </div>`;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renderMemberList() {
            const memberListEl = document.getElementById('member-list');
            if (!memberListEl) return;
            memberListEl.innerHTML = '';
            
            dbUsers.forEach(user => {
                if (!user || (!user.isApproved && !user.isAdmin)) return;
                let isOnline = user.lastActive && (Date.now() - user.lastActive < 15000);
                let userTeamTag = user.team && user.team !== 'Unassigned' ? `<span class="text-[9px] text-red-400 font-medium block">${user.team}</span>` : '';
                let userPfp = user.pfp || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.username}`;
                
                memberListEl.innerHTML += `
                    <div class="flex items-center justify-between py-1 px-1.5 text-xs text-slate-300 cursor-pointer hover:bg-[#151821] rounded" onclick="viewUserProfile('${user.username}')">
                        <div class="flex items-center space-x-2">
                            <img src="${userPfp}" class="w-7 h-7 rounded-full object-cover border border-red-600/30">
                            <div>
                                <div class="font-bold text-white flex items-center space-x-1">
                                    <span>${user.username}</span>
                                    ${user.isAdmin ? '<span class="text-[9px] bg-red-600 text-white px-1 rounded">Admin</span>' : ''}
                                </div>
                                ${userTeamTag}
                            </div>
                        </div>
                        <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-red-500 shadow-sm shadow-red-500' : 'bg-slate-600'}"></span>
                    </div>`;
            });
        }

        const messageInput = document.getElementById('message-input');
        if (messageInput) {
            messageInput.addEventListener('input', function(e) {
                let val = e.target.value;
                let mentionSuggestions = document.getElementById('mention-suggestions');
                if (!mentionSuggestions) return;

                let lastAtIndex = val.lastIndexOf('@');
                if (lastAtIndex !== -1 && (lastAtIndex === 0 || val[lastAtIndex - 1] === ' ')) {
                    let query = val.substring(lastAtIndex + 1).toLowerCase();
                    let matchedUsers = dbUsers.filter(u => u && u.username && u.username.toLowerCase().startsWith(query));
                    
                    if (matchedUsers.length > 0) {
                        mentionSuggestions.innerHTML = matchedUsers.map(u => 
                            `<div onclick="insertMention('${u.username}')" class="p-1.5 hover:bg-[#151821] cursor-pointer text-xs text-white">@${u.username}</div>`
                        ).join('');
                        mentionSuggestions.classList.remove('hidden');
                    } else {
                        mentionSuggestions.classList.add('hidden');
                    }
                } else {
                    mentionSuggestions.classList.add('hidden');
                }
            });
        }

        function insertMention(username) {
            let input = document.getElementById('message-input');
            let val = input.value;
            let lastAtIndex = val.lastIndexOf('@');
            input.value = val.substring(0, lastAtIndex) + `@${username} `;
            document.getElementById('mention-suggestions').classList.add('hidden');
            input.focus();
        }

        function viewUserProfile(username) {
            let user = dbUsers.find(u => u && u.username && u.username.toLowerCase() === username.toLowerCase());
            if (!user) {
                alert("User profile not found.");
                return;
            }

            document.getElementById('profile-avatar').src = user.pfp || `https://api.dicebear.com/7.x/identicon/svg?seed=${username}`;
            document.getElementById('profile-username').innerText = user.username || username;
            document.getElementById('profile-team').innerText = `Team / Role: ${user.team || 'Unassigned'}`;
            document.getElementById('profile-game').innerText = `Main Game: ${user.game || 'Not specified'}`;
            document.getElementById('profile-role-badge').innerText = user.role || (user.isAdmin ? 'Admin' : 'Member');

            let socials = user.socials || {};
            document.getElementById('profile-socials-list').innerHTML = `
                <p>TikTok: ${socials.tiktok ? `<a href="${socials.tiktok}" target="_blank" class="text-red-500 hover:underline">${socials.tiktok}</a>` : '<span class="text-slate-600">None</span>'}</p>
                <p>Discord: ${socials.discord ? `<span class="text-slate-300">${socials.discord}</span>` : '<span class="text-slate-600">None</span>'}</p>
                <p>FB Page: ${socials.fb ? `<a href="${socials.fb}" target="_blank" class="text-red-500 hover:underline">${socials.fb}</a>` : '<span class="text-slate-600">None</span>'}</p>
                <p>X (Twitter): ${socials.x ? `<a href="${socials.x}" target="_blank" class="text-slate-300 hover:underline">${socials.x}</a>` : '<span class="text-slate-600">None</span>'}</p>
                <p>Spotify: ${socials.spotify ? `<a href="${socials.spotify}" target="_blank" class="text-green-400 hover:underline">${socials.spotify}</a>` : '<span class="text-slate-600">None</span>'}</p>
            `;
            openModal('profile-modal');
        }

        function openEditProfile() {
            if (!currentUser) return;
            document.getElementById('edit-game').value = currentUser.game || '';
            document.getElementById('edit-tiktok').value = currentUser.socials?.tiktok || '';
            document.getElementById('edit-discord').value = currentUser.socials?.discord || '';
            document.getElementById('edit-fb').value = currentUser.socials?.fb || '';
            document.getElementById('edit-x').value = currentUser.socials?.x || '';
            document.getElementById('edit-spotify').value = currentUser.socials?.spotify || '';
            document.getElementById('edit-avatar-file').value = '';
            openModal('edit-profile-modal');
        }

        function handleSaveProfile(e) {
            e.preventDefault();
            currentUser.game = document.getElementById('edit-game').value;
            currentUser.socials = {
                tiktok: document.getElementById('edit-tiktok').value,
                discord: document.getElementById('edit-discord').value,
                fb: document.getElementById('edit-fb').value,
                x: document.getElementById('edit-x').value,
                spotify: document.getElementById('edit-spotify').value
            };

            const avatarFileEl = document.getElementById('edit-avatar-file');
            if (avatarFileEl.files && avatarFileEl.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentUser.pfp = event.target.result;
                    finalizeProfileSave();
                };
                reader.readAsDataURL(avatarFileEl.files[0]);
            } else {
                finalizeProfileSave();
            }
        }

        function finalizeProfileSave() {
            saveUserToFirebase(currentUser);
            localStorage.setItem('rift_current_user', JSON.stringify(currentUser));
            alert('Profile updated successfully!');
            closeModal('edit-profile-modal');
            initAppState();
        }

        function openAdminPasswordModal() {
            if (!currentUser || !currentUser.isAdmin) {
                alert("Unauthorized action.");
                return;
            }
            const passInput = document.getElementById('admin-portal-pass-input');
            if (passInput) passInput.value = '';
            openModal('admin-password-modal');
        }

        function handleAdminAuth(e) {
            e.preventDefault();
            const passInput = document.getElementById('admin-portal-pass-input');
            const passVal = passInput ? passInput.value.trim() : '';
            
            if (passVal !== "rr2024") {
                alert("Incorrect admin password!");
                return;
            }
            
            closeModal('admin-password-modal');
            renderAdminPortalData();
            openModal('admin-portal-modal');
        }

        function renderAdminPortalData() {
            let pendingUsers = dbUsers.filter(u => u && !u.isApproved && !u.isAdmin);

            const pendingContainer = document.getElementById('admin-pending-list');
            if (pendingContainer) {
                pendingContainer.innerHTML = pendingUsers.length === 0 ? 
                    `<p class="text-slate-500 italic p-2">No pending user registrations.</p>` :
                    pendingUsers.map(u => `
                        <div class="flex items-center justify-between bg-[#12141c] p-2.5 rounded border border-red-600/30 mb-2">
                            <div>
                                <span class="font-bold text-white">${u.username}</span> 
                                <span class="text-red-400 text-[11px]">(${u.game || 'League of Legends'})</span>
                                <span class="block text-[10px] text-slate-400">Email: ${u.email || 'No email provided'}</span>
                            </div>
                            <button type="button" onclick="approveUser('${u.username}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-xs font-bold transition shadow">Approve</button>
                        </div>
                    `).join('');
            }

            const membersContainer = document.getElementById('admin-members-list');
            if (membersContainer) {
                membersContainer.innerHTML = dbUsers
                    .filter(u => u && u.username)
                    .map(u => {
                        let memberPfp = u.pfp || `https://api.dicebear.com/7.x/identicon/svg?seed=${u.username}`;
                        return `
                        <div class="flex items-center justify-between bg-[#12141c] p-2.5 rounded border border-red-600/20 mb-2">
                            <div class="flex items-center space-x-3">
                                <img src="${memberPfp}" class="w-8 h-8 rounded-full object-cover border border-red-600/40">
                                <div>
                                    <div class="font-bold text-white text-xs flex items-center space-x-1">
                                        <span>${u.username}</span>
                                        ${u.isAdmin ? '<span class="text-red-500 text-[9px]">(Admin)</span>' : ''}
                                        ${!u.isApproved && !u.isAdmin ? '<span class="text-yellow-500 text-[9px]">(Pending)</span>' : ''}
                                    </div>
                                    <div class="text-[10px] text-slate-400">Game: ${u.game || 'N/A'}</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div>
                                    <label class="block text-[9px] text-slate-400 mb-0.5">Team / Role</label>
                                    <input type="text" id="team-input-${u.username}" value="${u.team || 'Unassigned'}" class="bg-[#0b0c10] border border-slate-700 rounded px-2 py-1 text-xs text-white w-28 focus:border-red-600">
                                </div>
                                <button type="button" onclick="updateUserTeam('${u.username}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1.5 rounded text-[10px] font-bold mt-3">Save</button>
                                ${u.username.toLowerCase() !== 'takeku' ? `<button type="button" onclick="banUser('${u.username}')" class="bg-slate-800 hover:bg-red-950 text-red-400 px-2 py-1.5 rounded text-[10px] font-bold mt-3">Remove</button>` : ''}
                            </div>
                        </div>
                    `;}).join('');
            }

            document.getElementById('admin-site-title-input').value = localStorage.getItem('rift_site_title') || 'Rift Raiders Portal';
            document.getElementById('admin-brand-text-input').value = localStorage.getItem('rift_brand_text') || 'Rift Raiders';
        }

        function approveUser(username) {
            let targetUser = dbUsers.find(u => u && u.username && u.username.toLowerCase() === username.toLowerCase());
            
            if (targetUser) {
                targetUser.isApproved = true;
                targetUser.role = 'Member';
                targetUser.team = targetUser.team && targetUser.team !== 'Unassigned' ? targetUser.team : 'Team Alpha';
                
                saveUserToFirebase(targetUser);
                renderAdminPortalData();

                if (targetUser.email) {
                    let templateParams = {
                        to_email: targetUser.email,
                        to_name: targetUser.username,
                        message: "Your account has been approved by the Admin! You can now log in to the Rift Raiders portal."
                    };

                    emailjs.send("service_riftraiders", "template_riftraiders", templateParams)
                        .then(function(response) {
                            alert(`Successfully approved ${targetUser.username} and sent email notification via EmailJS!`);
                        }, function(error) {
                            alert(`Approved ${targetUser.username}, but failed to send email: ` + JSON.stringify(error));
                        });
                } else {
                    alert(`Successfully approved ${targetUser.username}!`);
                }
            }
        }

        function updateUserTeam(username) {
            let targetUser = dbUsers.find(u => u && u.username && u.username.toLowerCase() === username.toLowerCase());
            let inputField = document.getElementById(`team-input-${username}`);
            if (targetUser && inputField) {
                targetUser.team = inputField.value.trim() || 'Unassigned';
                saveUserToFirebase(targetUser);
                alert(`Updated team/role for ${username}!`);
            }
        }

        function banUser(username) {
            if (confirm(`Remove ${username} from the system?`)) {
                database.ref('users/' + username).remove();
                renderAdminPortalData();
            }
        }

        function updateWebsiteBranding() {
            let newTitle = document.getElementById('admin-site-title-input').value.trim();
            let newBrand = document.getElementById('admin-brand-text-input').value.trim();

            if (newTitle) {
                document.title = newTitle;
                localStorage.setItem('rift_site_title', newTitle);
                let mainTitleEl = document.getElementById('main-site-title');
                if(mainTitleEl) mainTitleEl.innerText = newTitle;
            }
            if (newBrand) {
                localStorage.setItem('rift_brand_text', newBrand);
                let brandTitleEl = document.getElementById('sidebar-brand-title');
                if(brandTitleEl) brandTitleEl.innerText = newBrand;
            }
            alert("Website branding updated successfully!");
        }

        function handleSendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if((text !== '' || currentMediaData) && currentUser) {
                let finalMsg = text;
                if(currentMediaData) {
                    finalMsg += `<br><a href="${currentMediaData}" download="${currentMediaName}" class="text-red-400 underline text-[10px]">📎 ${currentMediaName}</a>`;
                }

                const newMsg = {
                    id: Date.now(),
                    username: currentUser.username,
                    game: currentUser.game,
                    isAdmin: currentUser.isAdmin,
                    text: finalMsg,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                };

                if(!dbMessages[currentChannel]) dbMessages[currentChannel] = [];
                dbMessages[currentChannel].push(newMsg);
                
                database.ref('messages').set(dbMessages);
                input.value = '';
                clearMedia();
            }
        }

        function editMessage(msgId) {
            let msgs = dbMessages[currentChannel] || [];
            let msg = msgs.find(m => m && m.id === msgId);
            if (!msg) return;

            let newText = prompt("Edit message:", msg.text);
            if (newText !== null && newText.trim() !== "") {
                msg.text = newText.trim();
                database.ref('messages').set(dbMessages);
            }
        }

        function deleteMessage(msgId) {
            if (confirm("Delete this message?")) {
                dbMessages[currentChannel] = (dbMessages[currentChannel] || []).filter(m => m && m.id !== msgId);
                database.ref('messages').set(dbMessages);
            }
        }

        function previewMedia(input) {
            if (input.files && input.files[0]) {
                currentMediaName = input.files[0].name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentMediaData = e.target.result;
                    document.getElementById('media-preview-container')?.classList.remove('hidden');
                    document.getElementById('file-name-display').innerText = currentMediaName;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearMedia() {
            document.getElementById('media-input').value = '';
            document.getElementById('media-preview-container')?.classList.add('hidden');
            currentMediaData = null;
            currentMediaName = null;
        }

        setInterval(() => {
            if(currentUser) {
                currentUser.lastActive = Date.now();
                database.ref('users/' + currentUser.username + '/lastActive').set(currentUser.lastActive);
            }
        }, 10000);

        initFirebaseListeners();

        if (currentUser) {
            initAppState();
        }
        
        let savedTitle = localStorage.getItem('rift_site_title');
        if (savedTitle) {
            document.title = savedTitle;
            let mainTitleEl = document.getElementById('main-site-title');
            if(mainTitleEl) mainTitleEl.innerText = savedTitle;
        }

        let savedBrand = localStorage.getItem('rift_brand_text');
        if (savedBrand) {
            let brandTitleEl = document.getElementById('sidebar-brand-title');
            if(brandTitleEl) brandTitleEl.innerText = savedBrand;
        }
    </script>
</body>
</html>
