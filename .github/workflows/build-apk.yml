- name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --refresh-dependencies || ./gradlew assembleDebug --rerun-tasks

      - name: Build Android Release Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --refresh-dependencies || ./gradlew bundleRelease --rerun-tasks
