name: Build Rift Raiders Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Project and Dependencies
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          npm install
          npx cap init "Rift Raiders" "com.riftraiders.official" --web-dir www --npm-client npm || true
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Raiders-Official-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
