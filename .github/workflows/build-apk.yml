name: Build Rift Raiders Play Store Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install

      - name: Prepare Web Assets Directory (www)
        run: |
          if [ -f "www" ]; then
            rm -f www
          fi
          mkdir -p www
          if [ -f "index.html" ]; then
            cp -f index.html www/
          else
            echo "<h1>Rift Raiders</h1>" > www/index.html
          fi

      - name: Install Capacitor Android Platform
        run: npx cap add android

      - name: Install Capacitor Assets Tool
        run: npm install @capacitor/assets --save-dev

      - name: Generate App Icon and Splash Screen
        run: npx capacitor-assets generate --ios --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Raiders-PlayStore-Bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
