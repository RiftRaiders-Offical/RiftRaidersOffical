name: Build Rift Raiders APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-rift-raiders-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          for bin in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"
          do
            if [ -x "$bin" ]; then
              yes | timeout 60 "$bin" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            fi
          done

      - name: Prepare www folder and index.html
        run: |
          set -e
          if [ -e "www" ] && [ ! -d "www" ]; then
            rm -f "www"
          fi
          mkdir -p "www"
          if [ -f "index.html" ]; then
            cp -f "index.html" "www/index.html"
          elif [ -f "www/index.html" ]; then
            cp -f "www/index.html" "index.html"
          else
            echo "Error: index.html not found in root or www/"
            exit 1
          fi
          ls -la www

      - name: Initialize Capacitor and Android project if missing
        run: |
          set -e
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          if ! node -e "require('@capacitor/core')" 2>/dev/null; then
            npm install @capacitor/core @capacitor/cli
          fi

          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Rift Raiders" "com.riftraiders.official" --web-dir www
          fi

          if [ ! -d "android" ]; then
            if ! node -e "require('@capacitor/android')" 2>/dev/null; then
              npm install @capacitor/android
            fi
            npx cap add android
          fi

      - name: Bump Android versionCode and versionName
        run: |
          set -e
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            NEW_VERSION_CODE=$((100 + ${GITHUB_RUN_NUMBER:-1}))
            NEW_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER:-1}"
            node -e '
              const fs = require("fs");
              const p = process.argv[1];
              const code = process.argv[2];
              const name = process.argv[3];
              let content = fs.readFileSync(p, "utf8");
              if (/versionCode\s+\d+/.test(content)) {
                content = content.replace(/versionCode\s+\d+/, `versionCode ${code}`);
              }
              if (/versionName\s+"[^"]*"/.test(content)) {
                content = content.replace(/versionName\s+"[^"]*"/, `versionName "${name}"`);
              }
              fs.writeFileSync(p, content, "utf8");
            ' "$GRADLE_FILE" "$NEW_VERSION_CODE" "$NEW_VERSION_NAME"
            echo "Updated $GRADLE_FILE -> versionCode: $NEW_VERSION_CODE, versionName: $NEW_VERSION_NAME"
          fi

      - name: Sync web assets to Android
        run: |
          set -e
          cp -f "index.html" "www/index.html"
          npx cap copy android

      - name: Build Debug APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Raiders-Official-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
