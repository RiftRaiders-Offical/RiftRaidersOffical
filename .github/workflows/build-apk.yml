name: Build Rift Raiders APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets Directory (www)
        run: |
          if [ -e www ] && [ ! -d www ]; then
            rm -f www
          fi
          mkdir -p www
          if [ -f index.html ]; then
            cp -f index.html www/index.html
          elif [ ! -f www/index.html ]; then
            echo "<h1>Rift Raiders - Official Guild</h1>" > www/index.html
          fi
          ls -la www

      - name: Install Dependencies & Fresh Capacitor Android
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Raiders-Official-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
