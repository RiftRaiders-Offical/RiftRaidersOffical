name: Build Rift Raiders Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Web Assets Directory
        run: |
          # Kung ang www ay isang file, burahin muna para maging totoong folder ito
          if [ -f "www" ]; then
            rm -f www
          fi
          
          # Gumawa ng www folder kung wala pa
          mkdir -p www
          
          # Ilipat o kopyahin ang index.html kung naroroon
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ ! -f "www/index.html" ]; then
            echo "<!DOCTYPE html><html><head><title>Rift Raiders</title></head><body><h1>Rift Raiders</h1></body></html>" > www/index.html
          fi

      - name: Install Dependencies
        run: npm install

      - name: Add Capacitor Android
        run: npx cap add android || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Raiders-Official-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
