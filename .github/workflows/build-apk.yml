name: Build Rift Raiders App with Push Notifications

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install

      - name: Install Capacitor Push Notifications Plugin (v6)
        run: npm install @capacitor/push-notifications@6

      - name: Prepare Web Assets Directory (www)
        run: |
          if [ -f "www" ]; then
            rm -f www
          fi
          mkdir -p www
          if [ -f "index.html" ]; then
            cp -f index.html www/index.html
          else
            echo "<h1>Rift Raiders</h1>" > www/index.html
          fi

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy google-services.json to Android App
        run: |
          if [ -f "google-services.json" ]; then
            cp -f google-services.json android/app/google-services.json
            echo "google-services.json copied successfully!"
          else
            echo "WARNING: google-services.json not found in root directory!"
          fi

      - name: Generate App Icon and Splash Screen
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android Release Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Raiders-Official-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rift-Raiders-PlayStore-Bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
