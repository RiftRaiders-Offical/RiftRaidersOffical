<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rift Raiders - Admin Portal & Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body class="bg-[#0b0c10] text-white p-4 font-sans pb-20">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-[#0b0c10] z-50 flex flex-col items-center justify-center p-4">
        <div class="text-red-500 font-black italic text-3xl mb-2">RR ADMIN PORTAL</div>
        <p class="text-xs text-slate-400 mb-6">Admin Settings & Management</p>
        <input type="password" id="admin-pass" placeholder="Enter Password" class="bg-[#161822] border border-white/10 px-4 py-2 rounded mb-4 focus:outline-none focus:border-red-500 text-center text-sm w-full max-w-xs">
        <button onclick="checkPass()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded font-bold uppercase text-xs w-full max-w-xs transition">Login</button>
        <p class="text-[10px] text-slate-500 mt-4">Default Password: rr2024</p>
    </div>

    <!-- ADMIN DASHBOARD PANEL -->
    <div id="admin-dashboard" class="hidden max-w-2xl mx-auto space-y-6">
        
        <!-- TOP HEADER WITH "YOU" PROFILE SECTION -->
        <div class="flex justify-between items-center bg-[#161822] p-4 rounded-xl border border-white/5">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-red-600/20 border border-red-500/40 flex items-center justify-center font-black text-red-500 text-sm">
                    YOU
                </div>
                <div>
                    <h1 class="text-white font-black text-sm uppercase tracking-wider">Admin Portal</h1>
                    <p class="text-[10px] text-slate-400">Logged in as: <span class="text-red-400 font-bold">You</span></p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="resetDefaultData()" class="bg-yellow-600/20 border border-yellow-500/40 text-yellow-400 px-3 py-1.5 rounded text-[10px] font-bold hover:bg-yellow-600/30 transition">Reset DB</button>
                <a href="index.html" class="bg-white/5 hover:bg-white/10 text-slate-300 px-3 py-1.5 rounded text-[10px] font-bold transition">View Site</a>
            </div>
        </div>

        <!-- ADMIN SETTINGS & MANAGEMENT SECTIONS -->
        <div class="grid grid-cols-1 gap-6">
            
            <!-- 1. ADD PLAYER -->
            <div class="bg-[#161822] p-5 rounded-xl border border-white/5 space-y-4">
                <h2 class="font-black text-sm uppercase text-red-500 flex items-center justify-between">
                    <span>1. Add Competitive Player</span>
                    <span class="text-[9px] text-slate-500 font-normal">Roster Manager</span>
                </h2>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Select Game Category:</label>
                    <select id="p-game" onchange="onGameChange()" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 text-white font-bold focus:outline-none focus:border-red-500">
                        <option value="Wild Rift">Wild Rift</option>
                        <option value="League of Legends">League of Legends (PC)</option>
                        <option value="Valorant">Valorant</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">In-Game Name (IGN):</label>
                        <input type="text" id="p-ign" placeholder="e.g. Takeku" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Riot ID Tag:</label>
                        <input type="text" id="p-tag" placeholder="e.g. PH1" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Team Name:</label>
                    <input type="text" id="p-team" placeholder="e.g. Rift Raiders Main" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                </div>

                <div>
                    <label id="lbl-role" class="text-[10px] font-bold text-slate-400 uppercase">Player Role:</label>
                    <input type="text" id="p-role" placeholder="e.g. Midlaner" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Player Profile Photo:</label>
                    <input type="file" id="p-pfp" accept="image/*" class="w-full text-xs text-slate-400 mt-1">
                </div>
                
                <div>
                    <label id="lbl-champs" class="text-[10px] font-bold text-slate-400 uppercase">Top 3 Champions / Agents (Pictures):</label>
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <input type="file" id="p-c1" accept="image/*" class="w-full text-[10px] text-slate-400">
                        <input type="file" id="p-c2" accept="image/*" class="w-full text-[10px] text-slate-400">
                        <input type="file" id="p-c3" accept="image/*" class="w-full text-[10px] text-slate-400">
                    </div>
                </div>
                
                <button onclick="addPlayer()" id="btn-player" class="bg-red-600 hover:bg-red-700 w-full py-2.5 rounded text-xs font-bold mt-2 uppercase tracking-wider transition">Save Player</button>
            </div>

            <!-- 2. ADD MATCH HISTORY -->
            <div class="bg-[#161822] p-5 rounded-xl border border-white/5 space-y-4">
                <h2 class="font-black text-sm uppercase text-red-500">2. Add Match Result</h2>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Our Team Name:</label>
                        <input type="text" id="m-team" placeholder="e.g. Rift Raiders Main" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Opponent Team:</label>
                        <input type="text" id="m-opp" placeholder="e.g. Execration" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Score (e.g. 2-0, 2-1):</label>
                    <input type="text" id="m-score" placeholder="2-0" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Match Type:</label>
                        <select id="m-type" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                            <option value="Scrim">Scrim</option>
                            <option value="Tournament">Tournament</option>
                            <option value="Showmatch">Showmatch</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Result:</label>
                        <select id="m-result" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                            <option value="Win">Win</option>
                            <option value="Lose">Lose</option>
                            <option value="Draw">Draw</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Date:</label>
                    <input type="date" id="m-date" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs mt-1 focus:outline-none focus:border-red-500">
                </div>

                <button onclick="addMatch()" class="bg-red-600 hover:bg-red-700 w-full py-2.5 rounded text-xs font-bold uppercase tracking-wider transition">Save Match Result</button>
            </div>

            <!-- 3. ADD CREATOR -->
            <div class="bg-[#161822] p-5 rounded-xl border border-white/5 space-y-4">
                <h2 class="font-black text-sm uppercase text-red-500">3. Add Creator</h2>
                <input type="text" id="c-name" placeholder="Creator Name" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs focus:outline-none focus:border-red-500">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Profile Photo:</label>
                    <input type="file" id="c-pfp" accept="image/*" class="w-full text-xs text-slate-400 mt-1">
                </div>
                <input type="text" id="c-link" placeholder="Social Media Link (URL)" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs focus:outline-none focus:border-red-500">
                <button onclick="addCreator()" id="btn-creator" class="bg-red-600 hover:bg-red-700 w-full py-2.5 rounded text-xs font-bold uppercase tracking-wider transition">Save Creator</button>
            </div>

            <!-- 4. ADD SPONSOR / PARTNER -->
            <div class="bg-[#161822] p-5 rounded-xl border border-white/5 space-y-4">
                <h2 class="font-black text-sm uppercase text-red-500">4. Add Sponsor / Partner Logo</h2>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Sponsor Logo Photo:</label>
                    <input type="file" id="part-logo" accept="image/*" class="w-full text-xs text-slate-400 mt-1">
                </div>
                <input type="text" id="part-link" placeholder="Sponsor Website / Facebook Link" class="w-full bg-[#0b0c10] border border-white/10 px-3 py-2 rounded text-xs focus:outline-none focus:border-red-500">
                <button onclick="addPartner()" id="btn-partner" class="bg-red-600 hover:bg-red-700 w-full py-2.5 rounded text-xs font-bold uppercase tracking-wider transition">Save Partner</button>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB7GyUvjxpgvVOpSS_wjH25m6HssUd_jbM",
            authDomain: "riftraiders-348f4.firebaseapp.com",
            databaseURL: "https://riftraiders-348f4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "riftraiders-348f4",
            storageBucket: "riftraiders-348f4.firebasestorage.app",
            messagingSenderId: "103200979693",
            appId: "1:103200979693:web:48d4b7f6e65734f2756ae4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        function checkPass() {
            if(document.getElementById('admin-pass').value === 'rr2024') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            } else {
                alert('Maling Password!');
            }
        }

        function onGameChange() {
            const game = document.getElementById('p-game').value;
            const roleLbl = document.getElementById('lbl-role');
            const champLbl = document.getElementById('lbl-champs');

            if(game === 'Valorant') {
                roleLbl.innerText = "Player Role / Main Agent (e.g. Duelist / Jett):";
                champLbl.innerText = "Top 3 Agents (Pictures):";
            } else {
                roleLbl.innerText = "Player Role (e.g. Mid / Jungler):";
                champLbl.innerText = "Top 3 Champions (Pictures):";
            }
        }

        async function uploadImage(file, folder) {
            if(!file) return 'https://via.placeholder.com/150';
            const ref = storage.ref(`${folder}/${Date.now()}_${file.name}`);
            await ref.put(file);
            return await ref.getDownloadURL();
        }

        async function addPlayer() {
            const btn = document.getElementById('btn-player');
            btn.innerText = "Saving & Uploading Pictures...";
            btn.disabled = true;

            try {
                const game = document.getElementById('p-game').value;
                const ign = document.getElementById('p-ign').value;
                const tag = document.getElementById('p-tag').value;
                const team = document.getElementById('p-team').value;
                const role = document.getElementById('p-role').value;
                
                const pfpUrl = await uploadImage(document.getElementById('p-pfp').files[0], 'players');
                const c1Url = await uploadImage(document.getElementById('p-c1').files[0], 'champs');
                const c2Url = await uploadImage(document.getElementById('p-c2').files[0], 'champs');
                const c3Url = await uploadImage(document.getElementById('p-c3').files[0], 'champs');

                await db.ref('roster').push({
                    game, ign, tag, team, role,
                    pfp: pfpUrl, champ1: c1Url, champ2: c2Url, champ3: c3Url
                });

                alert('Player successfully added!');
            } catch(e) {
                alert("Error saving player.");
                console.error(e);
            }
            btn.innerText = "Save Player";
            btn.disabled = false;
        }

        function addMatch() {
            const team = document.getElementById('m-team').value;
            const opponent = document.getElementById('m-opp').value;
            const score = document.getElementById('m-score').value;
            const type = document.getElementById('m-type').value;
            const result = document.getElementById('m-result').value;
            const date = document.getElementById('m-date').value;

            if(!team) { alert('Lagyan ng Our Team Name!'); return; }

            db.ref('matches').push({ team, opponent, score, type, result, date })
                .then(() => alert('Match result saved successfully!'));
        }

        async function addCreator() {
            const btn = document.getElementById('btn-creator');
            btn.innerText = "Uploading...";
            try {
                const name = document.getElementById('c-name').value;
                const social1 = document.getElementById('c-link').value;
                const pfpUrl = await uploadImage(document.getElementById('c-pfp').files[0], 'creators');

                await db.ref('creators').push({ name, pfp: pfpUrl, social1 });
                alert('Creator saved!');
            } catch(e) { alert("Error uploading creator."); }
            btn.innerText = "Save Creator";
        }

        async function addPartner() {
            const btn = document.getElementById('btn-partner');
            btn.innerText = "Uploading...";
            try {
                const link = document.getElementById('part-link').value;
                const logoUrl = await uploadImage(document.getElementById('part-logo').files[0], 'partners');

                await db.ref('partners').push({ link, logo: logoUrl });
                alert('Partner/Sponsor saved!');
            } catch(e) { alert("Error uploading partner."); }
            btn.innerText = "Save Partner";
        }

        function resetDefaultData() {
            if(confirm("Gusto mo bang i-reset at ilagay ang sample data?")) {
                alert("Database reset triggered.");
            }
        }
    </script>
</body>
</html>
