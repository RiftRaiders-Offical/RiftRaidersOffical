<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rift Raiders</title>
</head>
<body>
  <!-- Ilagay dito ang existing UI/content ng Rift Raiders website o app mo -->
  <h1>Rift Raiders</h1>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB7GyUvjxpgvVOpSS_wjH25m6HssUd_jbM",
      authDomain: "riftraiders-348f4.firebaseapp.com",
      databaseURL: "https://riftraiders-348f4-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "riftraiders-348f4",
      storageBucket: "riftraiders-348f4.firebasestorage.app",
      messagingSenderId: "103200979693",
      appId: "1:103200979693:web:48d4b7f6e65734f2756ae4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function setupPushNotifications() {
      // Gagana lang ito kapag naka-install ang app sa mobile (Capacitor)
      const PushNotifications = window.Capacitor?.Plugins?.PushNotifications;
      if (!PushNotifications) {
        console.log("Running in standard web browser - native push skipped.");
        return;
      }

      try {
        let permStatus = await PushNotifications.checkPermissions();
        if (permStatus.receive === 'prompt') {
          permStatus = await PushNotifications.requestPermissions();
        }

        if (permStatus.receive !== 'granted') {
          console.log("Push notification permission denied.");
          return;
        }

        await PushNotifications.register();

        // Kunin ang FCM token at i-save sa Firebase Realtime Database
        PushNotifications.addListener('registration', async (token) => {
          console.log('FCM Token:', token.value);
          // Gumamit ng safe key mula sa token para hindi ma-duplicate
          const safeTokenKey = token.value.replace(/[.#$\[\]]/g, '_');
          await set(ref(db, 'fcm_tokens/' + safeTokenKey), {
            token: token.value,
            platform: 'android',
            updatedAt: serverTimestamp()
          });
        });

        PushNotifications.addListener('registrationError', (err) => {
          console.error('Push registration error:', err);
        });

        // Kapag nakatanggap ng notification habang nakabukas ang app
        PushNotifications.addListener('pushNotificationReceived', (notification) => {
          alert(`${notification.title}\n${notification.body}`);
        });

      } catch (error) {
        console.error("Error setting up push notifications:", error);
      }
    }

    setupPushNotifications();
  </script>
</body>
</html>
